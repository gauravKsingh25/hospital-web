# nginx for the static export in /usr/share/nginx/html (see Dockerfile).
#
# `trailingSlash: true` in next.config.ts writes each page as <route>/index.html,
# so plain directory indexes serve every route.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Baseline headers. No Content-Security-Policy yet: the site's effect
    # scripts need one written and tested against them first.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Content-hashed build output: safe to cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
